<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradox Live Battle</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="menu">
        <div class="menu-container">
            <h1>🎴 Paradox Live Battle</h1>
            <p class="subtitle">Juego de Cartas Multijugador</p>
            
            <div class="menu-section">
                <!-- Campos fake para engañar al autocompletado -->
                <input type="text" style="position: absolute; top: -9999px; left: -9999px;" tabindex="-1" />
                <input type="password" style="position: absolute; top: -9999px; left: -9999px;" tabindex="-1" />
                
                <input 
                    id="nombre" 
                    placeholder="Tu nombre" 
                    maxlength="12" 
                    autocomplete="chrome-off" 
                    data-form-type="other"
                    type="text"
                />
                
                <button id="crear" class="btn-primary">
                    Crear Sala
                </button>
                
                <div class="divider">o únete a una sala</div>
                
                <!-- Campos fake para engañar al autocompletado -->
                <input type="text" style="position: absolute; top: -9999px; left: -9999px;" tabindex="-1" />
                <input type="password" style="position: absolute; top: -9999px; left: -9999px;" tabindex="-1" />
                
                <input 
                    id="codigo" 
                    placeholder="Código de sala" 
                    autocomplete="chrome-off" 
                    data-form-type="other"
                    type="text"
                />
                <button id="unirse" class="btn-secondary">
                     Unirse a Sala
                </button>
                
                <button id="espectador" class="btn-spectator">
                     Ver como Espectador
                </button>
            </div>
            
            <div id="info" class="info-message"></div>
        </div>
    </div>

    <div id="juego" style="display:none;">
        <div class="game-header">
            <div class="player-info enemy">
                <div class="player-name" id="nombreJ1"></div>
                <div class="player-hp" id="pvJ1">❤️ 20</div>
                <div class="player-stats">
                    <span id="manoJ1">🃏 5</span> | <span id="mazoJ1">📚 24</span>
                </div>
            </div>
            
            <div class="turn-indicator" id="turno">
                <div class="turn-text">Turno 1</div>
            </div>
            
            <div class="player-info ally">
                <div class="player-name" id="nombreJ2"></div>
                <div class="player-hp" id="pvJ2">❤️ 20</div>
                <div class="player-stats">
                    <span id="manoJ2">🃏 5</span> | <span id="mazoJ2">📚 24</span>
                </div>
            </div>
        </div>

        <div class="battlefield-section">
            <div class="section-title enemy-title">⚔️ Campo Rival</div>
            <div id="campoRival" class="battlefield enemy-field"></div>
        </div>

        <div class="controls-section">
            <div class="game-info">
                <span class="plays-counter">Cartas jugadas: <strong id="cartasJ">0</strong>/2</span>
            </div>
            <button id="terminar" class="btn-end-turn">⏭️ Terminar Turno</button>
            <button id="moneda" class="btn-coin">🪙 Lanzar Moneda</button>
        </div>

        <div class="battlefield-section">
            <div class="section-title ally-title">🛡️ Tu Campo</div>
            <div id="campoPropio" class="battlefield ally-field"></div>
        </div>

        <div class="bottom-section">
            <div class="deck-container">
                <div class="deck-title">📚 Mazo</div>
                <div class="deck-card" id="mazoVisual">
                    <div class="deck-count" id="mazoConteo">24</div>
                </div>
            </div>

            <div class="hand-container">
                <div class="section-title hand-title">
                    🃏 Tu Mano
                    <span class="hand-hint">Click para jugar | Doble click en campo para atacar</span>
                </div>
                <div id="manoPropia" class="hand"></div>
            </div>
        </div>

        <div class="log-section">
            <div class="log-title">📜 Historial de Batalla</div>
            <div id="log" class="log-content"></div>
        </div>
    </div>

    <div id="monedaOverlay" class="overlay">
        <div class="coin-result">
            <div id="resultadoMoneda" class="coin-text"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
